<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="100%" height="8">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388BFD" stop-opacity="0.1">
        <animate attributeName="stop-opacity" values="0.1; 0.6; 0.1" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#E53935">
        <animate attributeName="stop-color" values="#E53935; #388BFD; #58A6FF; #E53935" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#388BFD">
        <animate attributeName="stop-color" values="#388BFD; #E53935; #388BFD" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF; #E53935; #388BFD; #58A6FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#388BFD" stop-opacity="0.1">
        <animate attributeName="stop-opacity" values="0.1; 0.6; 0.1" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="2" width="1200" height="4" rx="2" fill="url(#glowGrad)" filter="url(#neonBlur)" />
</svg>
